# CI/CD for the TxGuard backend.
#
# Scope: main only.
#   PR → main    → build + test (guards the branch; nothing is deployed)
#   push to main → build + test, then deploy to the VM
#
# Deploy runs only after build+test pass, so a red build can never ship.
# Work on other branches runs no CI — run `dotnet test` locally before opening a PR.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allows a manual redeploy from the Actions tab

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # ── Build + unit tests ────────────────────────────────────────────────────
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Cache NuGet by lockfile-ish key so restores are fast on repeat runs.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore TxGuard.sln

      - name: Build
        run: dotnet build TxGuard.sln -c Release --no-restore

      - name: Test
        run: dotnet test TxGuard.sln -c Release --no-build --verbosity normal

  # ── Verify the container image still builds ───────────────────────────────
  # The API is deployed as a container, so a Dockerfile regression is a shipping
  # blocker even when `dotnet build` is green.
  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy (main only) ────────────────────────────────────────────────────
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: [build-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: deploy-production # never let two deploys race on the same host
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Fail loudly and specifically when a secret is missing, rather than letting an
      # empty value produce an unreadable ssh error three steps later.
      - name: Check required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER API_DOMAIN DEPLOY_SSH_KEY; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is not set"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "all four secrets present"

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # printf (not echo) guarantees the trailing newline OpenSSH requires; a key
          # pasted into the GitHub UI without one is rejected as "invalid format".
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Prove the key parses before using it, so a bad paste is reported here.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY is not a valid private key. Re-copy the WHOLE file including the BEGIN/END lines."
            exit 1
          fi
          echo "private key parses OK"

          # Not silenced: an empty known_hosts plus StrictHostKeyChecking=yes fails later
          # with a confusing 'Host key verification failed'.
          ssh-keyscan -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan returned nothing for $DEPLOY_HOST — host unreachable or port 22 filtered?"
            exit 1
          fi
          echo "host key recorded"

      - name: Verify SSH connectivity
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'echo "connected as $(whoami) on $(hostname)"'

      # --delete keeps the server clean, and --exclude protects files that only
      # exist on the host: the .env holding every secret, and build artefacts.
      - name: Sync source to VM
        run: |
          rsync -az --delete \
            --exclude 'bin/' --exclude 'obj/' --exclude '.git/' \
            --exclude '.idea/' --exclude '*.user' --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/txguard/backend/"

      - name: Rebuild and restart stack
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -e
             cd /opt/txguard/backend/deploy/vm
             docker compose up -d --build
             # Caddy mounts its config, so a changed Caddyfile needs an explicit reload.
             docker compose restart caddy
             docker image prune -f'

      # A green deploy step only means the commands exited 0. Prove the service is
      # actually serving, and that the Temporal worker reconnected after restart.
      - name: Smoke test
        run: |
          set -e
          for i in $(seq 1 20); do
            sleep 10
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              "https://${{ secrets.API_DOMAIN }}/health" || echo 000)
            echo "attempt $i: /health -> $code"
            [ "$code" = "200" ] && break
            [ "$i" = "20" ] && { echo "::error::health check never returned 200"; exit 1; }
          done

          worker=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /opt/txguard/backend/deploy/vm && docker compose logs --since 5m api | grep -c "Temporal worker started" || true')
          echo "worker start lines in last 5m: $worker"
          if [ "$worker" -lt 1 ]; then
            echo "::error::Temporal worker did not connect after deploy"
            exit 1
          fi
