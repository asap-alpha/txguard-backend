# nginx reverse-proxy site for TxGuard on a shared VPS (co-tenant with other sites).
# Install:
#   sudo cp nginx-txguard.conf /etc/nginx/sites-available/txguard
#   sudo ln -s /etc/nginx/sites-available/txguard /etc/nginx/sites-enabled/txguard
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d txguard.duckdns.org      # adds the 443 block + cert
#
# The WebSocket upgrade map must live at http{} scope — it's shipped separately in
# websocket_upgrade.conf (drop into /etc/nginx/conf.d/). SignalR needs it.
server {
    listen 80;
    listen [::]:80;
    server_name txguard.duckdns.org;

    # Submissions are tiny JSON; keep a sane cap.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket / SignalR upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Preserve host + real client IP (the API reads X-Forwarded-For).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SignalR long-lived connections must not be reaped mid-stream.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
